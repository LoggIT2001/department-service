on:
  push:
    branches:
      - main
      - develop
      - master
      - staging
      - feature/*
      - production

env:
  IMAGE_NAME: department-service
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: [self-hosted]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build mvn
        run: |
          mvn clean package -DskipTests

      - name: Build and tag Docker image
        run: |
          docker build -t ${env:IMAGE_NAME}:${env:IMAGE_TAG} .


  deploy-develop:
    runs-on: [self-hosted]
    needs: build
    if: github.ref == 'refs/heads/develop'

    env:
      APP_PORT: ${{ secrets.APP_PORT }}
      DB_URL: ${{ secrets.DB_URL }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: checkout code
        uses: actions/checkout@v3

      - name: Create .env file for Docker Compose
        shell: powershell
        run: |
          Set-Content -Path .env -Value "IMAGE_NAME=${{ env.IMAGE_NAME }}"
          Add-Content -Path .env -Value "IMAGE_TAG=${{ env.IMAGE_TAG }}"
          Add-Content -Path .env -Value "APP_PORT=${{ secrets.APP_PORT }}"
          Add-Content -Path .env -Value "DB_URL=${{ secrets.DB_URL }}"
          Add-Content -Path .env -Value "DB_USERNAME=${{ secrets.DB_USERNAME }}"
          Add-Content -Path .env -Value "DB_PASSWORD=${{ secrets.DB_PASSWORD }}"

      - name: Stop and Remove Existing Containers
        shell: cmd
        run: docker compose down || true  # Ignore errors if no containers are running

      - name: Run with Docker Compose
        shell: cmd
        run: docker compose up -d

  deploy-production:
    runs-on: [self-hosted]
    needs: build
    if: github.ref == 'refs/heads/production'

    env:
      APP_PORT: ${{ secrets.APP_PORT }}
      DB_URL: ${{ secrets.DB_URL }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: checkout code
        uses: actions/checkout@v3

      - name: Load image into Minikube
        run: |
          minikube image load ${env:IMAGE_NAME}:${env:IMAGE_TAG}

      - name: Create or update Kubernetes secret
        shell: cmd
        run: |
          kubectl create secret generic department-service-secret ^
            --from-literal=APP_PORT="${{secrets.APP_PORT}}" ^
            --from-literal=DB_URL="${{ secrets.DB_URL_PRODUCTION }}" ^
            --from-literal=DB_USERNAME="${{ secrets.DB_USERNAME }}" ^
            --from-literal=DB_PASSWORD="${{ secrets.DB_PASSWORD }}" ^
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Render Kubernetes manifests
        shell: powershell
        run: |
          (Get-Content k8s/deployment.yaml -Raw) `
            -replace '\$\{IMAGE_NAME\}', '${{ env.IMAGE_NAME }}' `
            -replace '\$\{IMAGE_TAG\}', '${{ env.IMAGE_TAG }}' | `
            Set-Content k8s/deployment-rendered.yaml
          (Get-Content k8s/service.yaml -Raw) | `
            Set-Content k8s/service-rendered.yaml
#          envsubst < k8s/deployment.yaml > k8s/deployment-rendered.yaml
#          envsubst < k8s/service.yaml > k8s/service-rendered.yaml

#      - name: Deploy Mysql External Service
#        shell: cmd
#        run: |
#            kubectl apply -f k8s/mysql-external-service.yaml

      - name: Deploy to Minikube
        run: |
          kubectl apply -f k8s/deployment-rendered.yaml
          kubectl apply -f k8s/service-rendered.yaml

      - name: Restart deployment
        run: |
          kubectl rollout restart deployment/department-service
          kubectl rollout status deployment/department-service
